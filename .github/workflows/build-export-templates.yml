name: Build Godot 4.4.1-stable Export Templates

on: [push, pull_request, workflow_dispatch]

jobs:
  build-macos-templates:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Vulkan SDK with MoltenVK
      run: |
        # 运行 Godot 提供的脚本安装 Vulkan SDK
        chmod +x misc/scripts/install_vulkan_sdk_macos.sh
        ./misc/scripts/install_vulkan_sdk_macos.sh
        
        # 设置环境变量指向安装的 Vulkan SDK
        VULKAN_SDK_PATH="$HOME/vulkan-sdk"
        if [ -d "$VULKAN_SDK_PATH" ]; then
          echo "VULKAN_SDK=$VULKAN_SDK_PATH/macOS" >> $GITHUB_ENV
          echo "VK_ICD_FILENAMES=$VULKAN_SDK_PATH/macOS/share/vulkan/icd.d/MoltenVK_icd.json" >> $GITHUB_ENV
          echo "VK_LAYER_PATH=$VULKAN_SDK_PATH/macOS/share/vulkan/explicit_layer.d" >> $GITHUB_ENV
          echo "Vulkan SDK installed successfully at $VULKAN_SDK_PATH"
        else
          echo "ERROR: Vulkan SDK installation failed!"
          exit 1
        fi

    - name: Install dependencies
      run: |
        brew install scons pkgconfig
        xcode-select --install || true

    - name: Build macOS export templates (Universal Binary)
      run: |
        # 构建发布版模板
        scons -j$(sysctl -n hw.logicalcpu) platform=osx target=template_release arch=universal
        
        # 构建调试版模板
        scons -j$(sysctl -n hw.logicalcpu) platform=osx target=template_debug arch=universal

    - name: Package templates
      run: |
        mkdir -p artifacts
        cp -rv bin/* artifacts/
        ls -la artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: godot-macos-templates
        path: artifacts/