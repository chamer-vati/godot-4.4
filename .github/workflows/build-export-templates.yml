name: Build Godot 4.4.1-stable Export Templates

on: [push, pull_request, workflow_dispatch]

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: 4.4
  SCONSFLAGS: verbose=yes warnings=extra werror=yes module_text_server_fb_enabled=yes strict_checks=yes

jobs:
  build-macos:
    runs-on: macos-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # - name: Editor (target=editor, tests=yes)
          #   cache-name: macos-editor
          #   target: editor
          #   tests: true
          #   bin: ./bin/godot.macos.editor.universal
          #   cache-limit: 1

          - name: Template (target=template_release, tests=yes)
            cache-name: macos-template
            target: template_release
            tests: true
            sconsflags: debug_symbols=no
            bin: ./bin/godot.macos.template_release.universal
            cache-limit: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup Vulkan SDK
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh
          
          # 查找最新安装的 Vulkan SDK 版本
          VULKAN_SDK_PATH=$(ls -d $HOME/VulkanSDK/*/ | sort -V | tail -n 1)
          
          if [ -z "$VULKAN_SDK_PATH" ]; then
            echo "ERROR: Failed to find Vulkan SDK installation"
            exit 1
          fi
          
          # 移除末尾的斜杠
          VULKAN_SDK_PATH=${VULKAN_SDK_PATH%/}
          
          echo "VULKAN_SDK_PATH=$VULKAN_SDK_PATH" >> $GITHUB_ENV
          echo "Found Vulkan SDK at: $VULKAN_SDK_PATH"
          
          # 设置必要的环境变量
          echo "VULKAN_SDK=$VULKAN_SDK_PATH/macOS" >> $GITHUB_ENV
          echo "VK_ICD_FILENAMES=$VULKAN_SDK_PATH/macOS/share/vulkan/icd.d/MoltenVK_icd.json" >> $GITHUB_ENV
          echo "VK_LAYER_PATH=$VULKAN_SDK_PATH/macOS/share/vulkan/explicit_layer.d" >> $GITHUB_ENV
          echo "PATH=$VULKAN_SDK_PATH/macOS/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Vulkan SDK installation
        run: |
          echo "Checking Vulkan SDK installation at: $VULKAN_SDK_PATH"
          ls -la "$VULKAN_SDK_PATH/"
          echo "Checking MoltenVK files:"
          ls -la "$VULKAN_SDK_PATH/macOS/lib/libMoltenVK.dylib" || echo "libMoltenVK.dylib not found"
          ls -la "$VULKAN_SDK_PATH/macOS/share/vulkan/icd.d/MoltenVK_icd.json" || echo "MoltenVK_icd.json not found"

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=x86_64 vulkan_sdk_path=${{ env.VULKAN_SDK_PATH }}
          platform: macos
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}
          scons-cache-limit: 0 # Only cap on second run to avoid purging unnecessarily

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm64 vulkan_sdk_path=${{ env.VULKAN_SDK_PATH }}
          platform: macos
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}
          scons-cache-limit: ${{ matrix.cache-limit }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          lipo -create ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64 -output ./bin/godot.macos.${{ matrix.target }}.universal
          rm ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        if: matrix.tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors