name: Build Godot 4.4.1-stable Export Templates

on: [push, pull_request, workflow_dispatch]

jobs:
  build-macos-templates:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install scons pkgconfig wget
        xcode-select --install || true

    - name: Install Vulkan SDK manually
      run: |
        # 手动下载并安装 Vulkan SDK
        VULKAN_SDK_VERSION="1.3.250.1"  # 使用与 Godot 兼容的版本
        VULKAN_SDK_URL="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.tar.gz"
        
        echo "Downloading Vulkan SDK from: $VULKAN_SDK_URL"
        wget -O vulkan-sdk.tar.gz "$VULKAN_SDK_URL"
        
        # 创建安装目录
        mkdir -p "$HOME/vulkan-sdk"
        tar -xzf vulkan-sdk.tar.gz -C "$HOME/vulkan-sdk" --strip-components 1
        rm vulkan-sdk.tar.gz
        
        # 设置环境变量
        VULKAN_SDK_PATH="$HOME/vulkan-sdk/macOS"
        echo "VULKAN_SDK_PATH=$VULKAN_SDK_PATH" >> $GITHUB_ENV
        echo "VULKAN_SDK=$VULKAN_SDK_PATH" >> $GITHUB_ENV
        echo "VK_ICD_FILENAMES=$VULKAN_SDK_PATH/share/vulkan/icd.d/MoltenVK_icd.json" >> $GITHUB_ENV
        echo "VK_LAYER_PATH=$VULKAN_SDK_PATH/share/vulkan/explicit_layer.d" >> $GITHUB_ENV
        echo "PATH=$VULKAN_SDK_PATH/bin:$PATH" >> $GITHUB_ENV
        
        # 验证安装
        if [ -d "$VULKAN_SDK_PATH" ]; then
          echo "Vulkan SDK successfully installed at $VULKAN_SDK_PATH"
          ls -la "$VULKAN_SDK_PATH/"
          echo "Checking for MoltenVK files:"
          ls -la "$VULKAN_SDK_PATH/lib/libMoltenVK.dylib" || echo "libMoltenVK.dylib not found"
          ls -la "$VULKAN_SDK_PATH/share/vulkan/icd.d/MoltenVK_icd.json" || echo "MoltenVK_icd.json not found"
        else
          echo "ERROR: Vulkan SDK installation failed!"
          exit 1
        fi

    - name: Build macOS export templates (Universal Binary)
      run: |
        # 构建发布版模板 - 明确指定 vulkan_sdk_path
        scons -j$(sysctl -n hw.logicalcpu) platform=osx target=template_release arch=universal \
          vulkan_sdk_path="$VULKAN_SDK_PATH"
        
        # 构建调试版模板 - 明确指定 vulkan_sdk_path
        scons -j$(sysctl -n hw.logicalcpu) platform=osx target=template_debug arch=universal \
          vulkan_sdk_path="$VULKAN_SDK_PATH"

    - name: Package templates
      run: |
        mkdir -p artifacts
        cp -rv bin/* artifacts/
        ls -la artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: godot-macos-templates
        path: artifacts/