name: Build Godot 4.4.1-stable Export Templates

on: [push, pull_request, workflow_dispatch]
jobs:
  build-macos:
    name: Build macOS Templates
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: 4.4.1-stable

    - name: Install macOS dependencies
      run: |
        brew update
        brew install scons pkg-config yasm molten-vk
        echo "VULKAN_SDK=$(brew --prefix molten-vk)" >> $GITHUB_ENV
        echo "PATH=$VULKAN_SDK/bin:$PATH" >> $GITHUB_ENV

    - name: Build macOS templates
      run: |
        # 构建 x86_64 架构
        scons platform=macos target=template_release arch=x86_64 vulkan_sdk="$VULKAN_SDK" disable_metal=yes -j4
        scons platform=macos target=template_debug arch=x86_64 vulkan_sdk="$VULKAN_SDK" disable_metal=yes -j4
        
        # 构建 arm64 架构 (Apple Silicon)
        scons platform=macos target=template_release arch=arm64 vulkan_sdk="$VULKAN_SDK" disable_metal=yes -j4
        scons platform=macos target=template_debug arch=arm64 vulkan_sdk="$VULKAN_SDK" disable_metal=yes -j4

    - name: Verify build artifacts
      run: |
        echo "Checking build artifacts..."
        ls -la bin/
        # 检查至少有一些模板文件存在
        if ! ls bin/godot.macos.template_* 1> /dev/null 2>&1; then
          echo "ERROR: No template files found!"
          exit 1
        fi
        echo "Build artifacts verified."

    - name: Package macOS templates
      run: |
        mkdir -p bin/templates
        
        # 复制所有找到的模板文件
        for file in bin/godot.macos.template_*; do
          filename=$(basename "$file")
          # 根据架构重命名文件
          if [[ $filename == *".arm64" ]]; then
            newname="${filename//.template_release.arm64/_release_arm64}"
            newname="${newname//.template_debug.arm64/_debug_arm64}"
            cp "$file" "bin/templates/${newname}"
          elif [[ $filename == *".x86_64" ]]; then
            newname="${filename//.template_release.x86_64/_release_x86_64}"
            newname="${newname//.template_debug.x86_64/_debug_x86_64}"
            cp "$file" "bin/templates/${newname}"
          else
            # 处理没有明确架构标识的文件
            newname="${filename//.template_release/_release}"
            newname="${newname//.template_debug/_debug}"
            cp "$file" "bin/templates/${newname}"
          fi
        done
        
        # 列出打包前的文件以确保正确
        echo "Files to be packaged:"
        ls -la bin/templates/
        
        tar -czf macos-export-templates.tgz bin/templates/

    - name: Upload macOS templates artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-export-templates
        path: macos-export-templates.tgz

  create-release:
    name: Create Release
    needs: build-macos
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download macOS templates artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-export-templates
        path: artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/macos-export-templates.tgz
        tag_name: ${{ github.ref_name }}
        name: Godot ${{ github.ref_name }} macOS Export Templates
        body: |
          macOS export templates for Godot Engine ${{ github.ref_name }}
          
          Includes:
          - macOS x86_64 templates (Release and Debug)
          - macOS ARM64 templates (Release and Debug)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}