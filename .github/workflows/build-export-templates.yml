name: Build Godot 4.4.1-stable Export Templates

on: [push, pull_request, workflow_dispatch]

env:
  GODOT_VERSION: "4.4.1-stable"

jobs:
  build-windows:
    name: Build Windows Templates
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: ${{ env.GODOT_VERSION }}  # 确保检出正确的版本

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies
      run: |
        choco install scons -y
        choco install python -y

    - name: Build Windows templates (64-bit)
      run: |
        python -m SCons platform=windows target=template_release bits=64 -j 4
        python -m SCons platform=windows target=template_debug bits=64 -j 4

    - name: Package Windows templates
      run: |
        New-Item -ItemType Directory -Force -Path bin/templates
        Copy-Item bin/godot.windows.template_release.64.exe bin/templates/windows_64_release.exe
        Copy-Item bin/godot.windows.template_debug.64.exe bin/templates/windows_64_debug.exe
        Compress-Archive -Path bin/templates/* -DestinationPath windows-export-templates.zip

    - name: Upload Windows templates artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-export-templates
        path: windows-export-templates.zip

  build-macos:
    name: Build macOS Templates
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: ${{ env.GODOT_VERSION }}  # 确保检出正确的版本

    - name: Install dependencies
      run: |
        brew update
        brew install scons pkg-config yasm
        brew install molten-vk

    - name: Set up Vulkan SDK environment
      run: |
        echo "VULKAN_SDK=$(brew --prefix molten-vk)" >> $GITHUB_ENV
        echo "$VULKAN_SDK/bin" >> $GITHUB_PATH

    - name: Build macOS templates (x86_64)
      run: |
        scons platform=macos target=template_release arch=x86_64 vulkan_sdk="$VULKAN_SDK" -j4
        scons platform=macos target=template_debug arch=x86_64 vulkan_sdk="$VULKAN_SDK" -j4

    - name: Build macOS templates (ARM64)
      run: |
        scons platform=macos target=template_release arch=arm64 vulkan_sdk="$VULKAN_SDK" -j4
        scons platform=macos target=template_debug arch=arm64 vulkan_sdk="$VULKAN_SDK" -j4

    - name: Package macOS templates
      run: |
        mkdir -p bin/templates
        # x86_64 版本
        cp bin/godot.macos.template_release.x86_64 bin/templates/macos_template_release_x86_64
        cp bin/godot.macos.template_debug.x86_64 bin/templates/macos_template_debug_x86_64
        # ARM64 版本
        cp bin/godot.macos.template_release.arm64 bin/templates/macos_template_release_arm64
        cp bin/godot.macos.template_debug.arm64 bin/templates/macos_template_debug_arm64
        tar -czf macos-export-templates.tgz bin/templates/

    - name: Upload macOS templates artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-export-templates
        path: macos-export-templates.tgz

  create-release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download Windows templates artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-export-templates
        path: artifacts/windows

    - name: Download macOS templates artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-export-templates
        path: artifacts/macos

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/windows/windows-export-templates.zip
          artifacts/macos/macos-export-templates.tgz
        tag_name: ${{ github.ref }}
        name: Godot ${{ env.GODOT_VERSION }} Export Templates
        body: |
          Export templates for Godot Engine ${{ env.GODOT_VERSION }}
          
          Includes:
          - Windows 64-bit (Release and Debug)
          - macOS x86_64 (Release and Debug)
          - macOS ARM64 (Release and Debug)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}