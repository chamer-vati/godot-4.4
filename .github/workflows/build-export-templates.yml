name: Build Godot 4.4.1-stable Export Templates

on: [push, pull_request, workflow_dispatch]

jobs:
  build-macos:
    name: Build macOS Templates
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: 4.4.1-stable

    - name: Install macOS dependencies
      run: |
        brew update
        brew install scons pkg-config yasm molten-vk
        echo "VULKAN_SDK=$(brew --prefix molten-vk)" >> $GITHUB_ENV
        echo "PATH=$VULKAN_SDK/bin:$PATH" >> $GITHUB_ENV

    - name: Build macOS templates
      run: |
        scons platform=macos target=template_release vulkan_sdk="$VULKAN_SDK" disable_metal=yes -j4
        scons platform=macos target=template_debug vulkan_sdk="$VULKAN_SDK" disable_metal=yes -j4

    - name: Package macOS templates
      run: |
        mkdir -p bin/templates
        cp bin/godot.macos.template_release bin/templates/macos_template_release
        cp bin/godot.macos.template_debug bin/templates/macos_template_debug
        tar -czf macos-export-templates.tgz bin/templates/

    - name: Upload macOS templates artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-export-templates
        path: macos-export-templates.tgz

  build-windows:
    name: Build Windows Templates
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: 4.4.1-stable

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install SCons
      run: |
        pip install scons

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build Windows templates
      run: |
        scons platform=windows target=template_release bits=64 -j 4
        scons platform=windows target=template_debug bits=64 -j 4

    - name: Package Windows templates
      run: |
        New-Item -ItemType Directory -Force -Path bin/templates
        Copy-Item bin/godot.windows.template_release.64.exe bin/templates/windows_64_release.exe
        Copy-Item bin/godot.windows.template_debug.64.exe bin/templates/windows_64_debug.exe
        Compress-Archive -Path bin/templates/* -DestinationPath windows-export-templates.zip

    - name: Upload Windows templates artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-export-templates
        path: windows-export-templates.zip

  create-release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download macOS templates
      uses: actions/download-artifact@v4
      with:
        name: macos-export-templates
        path: artifacts/

    - name: Download Windows templates
      uses: actions/download-artifact@v4
      with:
        name: windows-export-templates
        path: artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/macos-export-templates.tgz
          artifacts/windows-export-templates.zip
        tag_name: ${{ github.ref_name }}
        name: Godot ${{ github.ref_name }} Export Templates
        body: |
          Export templates for Godot Engine ${{ github.ref_name }}
          
          Includes:
          - macOS templates (Release and Debug)
          - Windows 64-bit templates (Release and Debug)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}